# Bluetooth: advertising only
CONFIG_BT=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_DEVICE_NAME="SHT41"
CONFIG_BT_CTLR_TX_PWR_0=y

# Drivers
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_ADC=y

# Power management: sensor + I2C bus powered only while in use
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y
CONFIG_POWER_DOMAIN=y

# Board enables USB serial console by default: turn it all off
CONFIG_USB_DEVICE_STACK_NEXT=n
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n
